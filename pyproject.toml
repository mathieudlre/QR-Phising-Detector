[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qr-phishing-detector"
version = "0.1.0"
description = "Scanne un QR code et détecte les liens de phishing (quishing) avant qu'ils ne soient ouverts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mathieu Delrue" }]
keywords = ["qr-code", "phishing", "quishing", "cybersecurity", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# Dépendances du cœur : extraction des QR codes (Phase 2) et règles (Phase 3)
dependencies = [
    "zxing-cpp>=2.2",
    "opencv-python-headless>=4.8",
    "pillow>=10.0",
    "numpy>=1.26",
    "tldextract>=5.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Phases 4 à 6 : données et machine learning
ml = [
    "pandas>=2.1",
    "pyarrow>=14.0",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.44",
    "joblib>=1.3",
    "jupyter>=1.0",
    "matplotlib>=3.8",
]
# Phase 2 (bonus) : lecture des PDF
pdf = [
    "pymupdf>=1.23",
]
# Phases 7 et 8 : enrichissement externe, API et interface web
web = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "streamlit>=1.35",
]
# Outils de développement
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "qrcode[pil]>=7.4",  # pour générer des QR codes de test
]
# Tout installer d'un coup : pip install -e ".[all]"
all = ["qr-phishing-detector[ml,pdf,web,dev]"]

[project.urls]
Repository = "https://github.com/mathieudlre/qr-phishing-detector"

[tool.hatch.build.targets.wheel]
packages = ["src/qrguard"]

# --- Ruff : linter et formateur ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # erreurs de style (pycodestyle)
    "F",   # erreurs logiques (pyflakes)
    "I",   # tri des imports
    "B",   # bugs probables (bugbear)
    "UP",  # syntaxe Python moderne
    "S",   # sécurité (bandit)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # autorise assert dans les tests

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: test qui appelle un service externe (exclu par défaut en CI)",
]
